<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Aplikasi rotasi kerja 12 orang: Titik A, B, C dan Libur.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Rotasi Kerja</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">JADWAL KERJA</div>
        <h1>Rotasi 12 Orang</h1>
        <p class="sub">A → B → C → Libur</p>
      </div>
      <button id="installBtn" class="secondary hidden">Pasang</button>
    </header>

    <section class="card">
      <h2>Anggota</h2>
      <p class="hint">Masukkan 12 nama. Nama tersimpan otomatis di HP.</p>
      <div id="names"></div>
      <button id="saveNames" class="primary">Simpan Nama</button>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>Jadwal</h2>
          <p class="hint">Tentukan tanggal awal Minggu 1.</p>
        </div>
        <input id="startDate" type="date">
      </div>
      <div class="week-nav">
        <button id="prevWeek" class="secondary">‹</button>
        <strong id="weekTitle">Minggu 1</strong>
        <button id="nextWeek" class="secondary">›</button>
      </div>
      <div id="schedule" class="schedule"></div>
    </section>

    <section class="card">
      <h2>Aturan Rotasi</h2>
      <div class="rule"><b>A</b><span>→</span><b>B</b><span>→</span><b>C</b><span>→</span><b>Libur</b><span>→</span><b>A</b></div>
      <p class="hint">Setiap kelompok berisi tepat 3 orang. Siklus berulang setiap 4 minggu.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
